name: Scrape and Send to Telegram

on:
  schedule:
    - cron: '0 0 * * *'
    - cron: '11 1 * * *'
    - cron: '33 2 * * *'
    - cron: '44 3 * * *'
    - cron: '6 5 * * *'
    - cron: '17 6 * * *'
    - cron: '39 7 * * *'
    - cron: '50 8 * * *'
    - cron: '12 10 * * *'
    - cron: '23 11 * * *'
    - cron: '45 12 * * *'
    - cron: '56 13 * * *'
    - cron: '18 15 * * *'
    - cron: '29 16 * * *'
    - cron: '51 17 * * *'
    - cron: '2 19 * * *'
    - cron: '24 20 * * *'
    - cron: '35 21 * * *'
    - cron: '57 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Scrape and send to Telegram
        env:
          TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
          TWITTER_CT0: ${{ secrets.TWITTER_CT0 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/scrape-tweets.js

      - name: Commit updated state
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update last seen tweet IDs [skip ci]"
          file_pattern: "data/state.json"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
